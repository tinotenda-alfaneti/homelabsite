{{- if .Values.persistence.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-init-data
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  posts.yaml: |
{{ .Values.initialData.posts | toYaml | indent 4 }}
  projects.yaml: |
{{ .Values.initialData.projects | toYaml | indent 4 }}
{{- end }}
